<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clavis — Latin for "key". The key's bow is the letter C. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#13224A"/>
      <stop offset="0.55" stop-color="#0A1330"/>
      <stop offset="1" stop-color="#060B1D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="key" gradientUnits="userSpaceOnUse" x1="80" y1="160" x2="440" y2="360">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="0.55" stop-color="#2FA6FF"/>
      <stop offset="1" stop-color="#46E6FF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>

    <!-- soft light behind the key -->
    <g opacity="0.55" filter="url(#soft)" transform="translate(22 -6)">
      <path d="M 237.9 188.1 A 96 96 0 1 0 237.9 323.9" fill="none" stroke="#2F8CFF" stroke-width="46" stroke-linecap="round"/>
      <path d="M 170 256 H 404" stroke="#2FC8FF" stroke-width="40" stroke-linecap="round"/>
    </g>

    <!-- the key: C-shaped bow, shaft through the opening, bit with two teeth -->
    <g fill="none" stroke="url(#key)" stroke-linecap="round" stroke-linejoin="round" transform="translate(22 -6)">
      <path d="M 237.9 188.1 A 96 96 0 1 0 237.9 323.9" stroke-width="46"/>
      <path d="M 170 256 H 404" stroke-width="40"/>
      <path d="M 404 256 V 316" stroke-width="40"/>
      <path d="M 342 256 V 300" stroke-width="36"/>
    </g>
    <!-- pivot where the shaft meets the bow -->
    <circle cx="192" cy="250" r="13" fill="#0A1330"/>

    <!-- hairline edge -->
    <rect x="1.5" y="1.5" width="509" height="509" rx="115" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  </g>
</svg>
